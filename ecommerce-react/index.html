<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>TariqueScript — The everyday, upgraded</title>
    <meta
      name="description"
      content="A fast, accessible storefront: aisle-tinted catalogue, optimistic cart, and a shelf of live 3D objects drawn by a single shared WebGL renderer. Built with React 19, Vite and three.js."
    />
    <meta name="theme-color" content="#2438f0" />
    <meta name="color-scheme" content="light dark" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://ecommerce-ts-react.vercel.app/" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="TariqueScript — The everyday, upgraded" />
    <meta
      property="og:description"
      content="A fast, accessible storefront built with React 19, Vite and three.js."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Both font files, fetched in parallel with the JS rather than after the
         CSS that references them. The display face draws the hero headline,
         which is the largest contentful paint. -->
    <link
      rel="preload"
      href="/fonts/funnel-display-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/funnel-sans-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- The API is on a different origin and is hit immediately after parse,
         so start the DNS + TLS handshake now rather than at first fetch. -->
    <link rel="preconnect" href="https://ecommerce-api-eight-iota.vercel.app" crossorigin />
    <link rel="dns-prefetch" href="https://ecommerce-api-eight-iota.vercel.app" />

    <script>
      // Applies a saved theme before first paint. Inline and synchronous on
      // purpose — deferring it would flash the wrong background. The key is
      // versioned: the previous design stored "dark" for every visitor, and
      // that should not decide how they first meet this one.
      (function () {
        try {
          var saved = localStorage.getItem('ts-theme-v2');
          if (saved === 'dark' || saved === 'light') {
            document.documentElement.dataset.theme = saved;
          }
        } catch (e) {
          /* storage blocked — the day theme in the markup stands */
        }
      })();
    </script>

    <style>
      /* Paints the page background before the CSS bundle lands, so there is
         never a flash of the wrong colour. */
      html { background: #f3f1ec; }
      html[data-theme='dark'] { background: #0a0c24; }
      body { margin: 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 2rem; font-family: system-ui; color: #121433">
        This storefront needs JavaScript enabled.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
